<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis 15 - Jana</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&display=swap');

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  color:#f8edcf;
  background:#021208;
  font-family:Cinzel,serif;
}

.page{
  min-height:100vh;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 16px;

  background:
    radial-gradient(circle at 50% 20%, rgba(193,155,62,.22), transparent 28%),
    radial-gradient(circle at 10% 90%, rgba(20,100,57,.35), transparent 30%),
    linear-gradient(135deg,#011008,#07351e 50%,#011008);
}

.card{
  width:min(650px,100%);
  position:relative;
  text-align:center;
  padding:42px 25px 35px;
  border:1px solid #d8b65a;
  border-radius:24px;
  background:rgba(2,29,15,.9);

  box-shadow:
    0 0 45px rgba(225,187,75,.22),
    inset 0 0 50px rgba(218,177,68,.06);

  overflow:hidden;
}

.card:before{
  content:"";
  position:absolute;
  inset:10px;
  border:1px solid rgba(218,177,68,.45);
  border-radius:18px;
  pointer-events:none;
}

h1{
  font-size:1.25rem;
  letter-spacing:5px;
  margin:10px 0;
  color:#e8ce81;
}

h2{
  font-family:"Great Vibes",cursive;
  font-size:5.5rem;
  font-weight:400;
  margin:8px 0;
  color:#f1d47f;
  text-shadow:0 0 14px rgba(255,220,120,.35);
}

.subtitle{
  font-size:1.05rem;
  line-height:1.8;
  max-width:480px;
  margin:auto;
  color:#f3ead3;
}

.big15{
  font-family:"Great Vibes",cursive;
  font-size:6rem;
  line-height:.9;
  color:#e9c75d;
  text-shadow:0 0 20px rgba(255,215,100,.4);
  margin:20px 0;
}

.details{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin:25px auto;
  max-width:560px;
}

.detail{
  padding:13px 7px;
  border-top:1px solid #b99442;
  border-bottom:1px solid #b99442;
}

.detail strong{
  display:block;
  font-size:.75rem;
  letter-spacing:2px;
  color:#d9bc6c;
  margin-bottom:7px;
}

.detail span{
  font-size:1rem;
}

/* BOTÓN WHATSAPP */
.whatsapp-btn{
  display:inline-block;
  border:1px solid #d9b85c;

  background:linear-gradient(
    135deg,
    #b28a2e,
    #e8cf7d,
    #9d7625
  );

  color:#102313;
  padding:13px 22px;
  border-radius:999px;

  font-family:Cinzel,serif;
  font-weight:bold;
  text-decoration:none;

  box-shadow:0 5px 18px rgba(0,0,0,.3);
  margin:6px;

  transition:.25s;
}

.whatsapp-btn:hover{
  transform:scale(1.04);
  box-shadow:0 7px 22px rgba(232,207,125,.25);
}

/* BOTÓN MAPA */
.maps-btn{
  display:inline-block;
  text-decoration:none;

  border:1px solid #d9b85c;
  background:transparent;

  color:#f1d47f;
  padding:12px 21px;
  border-radius:999px;

  font-family:Cinzel,serif;
  font-weight:bold;
  cursor:pointer;

  box-shadow:0 5px 18px rgba(0,0,0,.22);
  margin:6px;

  transition:.25s;
}

.maps-btn:hover{
  background:rgba(217,184,92,.12);
  transform:scale(1.03);
}

#countdown{
  font-size:1rem;
  letter-spacing:1px;
  color:#e9d28a;
  margin:14px 0 4px;
}

#countdown span{
  font-weight:bold;
}

.butterfly{
  position:absolute;
  font-size:2rem;
  opacity:.8;
  animation:float 5s ease-in-out infinite;
}

.b1{
  top:35px;
  left:25px;
}

.b2{
  top:100px;
  right:30px;
  animation-delay:1s;
}

.b3{
  bottom:90px;
  left:25px;
  animation-delay:2s;
}

.b4{
  bottom:35px;
  right:35px;
  animation-delay:3s;
}

.spark{
  position:absolute;
  width:4px;
  height:4px;
  background:#f8dc82;
  border-radius:50%;

  box-shadow:0 0 12px #f8dc82;

  animation:twinkle 2s infinite;
}

@keyframes float{
  50%{
    transform:translateY(-13px) rotate(5deg);
  }
}

@keyframes twinkle{
  50%{
    opacity:.2;
    transform:scale(.5);
  }
}

@media(max-width:520px){

  h2{
    font-size:4.2rem;
  }

  .big15{
    font-size:4.8rem;
  }

  .details{
    grid-template-columns:1fr;
  }

  .subtitle{
    font-size:.92rem;
  }

  .card{
    padding:35px 18px;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="card">

    <!-- MARIPOSAS -->
    <div class="butterfly b1">🦋</div>
    <div class="butterfly b2">🦋</div>
    <div class="butterfly b3">🦋</div>
    <div class="butterfly b4">🦋</div>

    <!-- BRILLITOS -->
    <div class="spark" style="top:18%;left:12%"></div>
    <div class="spark" style="top:30%;right:14%"></div>
    <div class="spark" style="top:65%;left:16%"></div>
    <div class="spark" style="bottom:18%;right:17%"></div>

    <h1>MIS 15 AÑOS</h1>

    <p class="subtitle">
      Es un honor para mí compartir este momento tan especial
      con las personas que más quiero.
    </p>

    <h2>Jana</h2>

    <div class="big15">
      15<br>
      <small style="font-size:.45em">años</small>
    </div>

    <!-- DATOS -->
    <div class="details">

      <div class="detail">
        <strong>FECHA</strong>
        <span>28/11/2026</span>
      </div>

      <div class="detail">
        <strong>HORA</strong>
        <span>21:30 hs</span>
      </div>

      <div class="detail">
        <strong>LUGAR</strong>
        <span>Trébol 4</span>
      </div>

    </div>

    <!-- CUENTA REGRESIVA -->
    <div id="countdown">
      Preparando la cuenta regresiva...
    </div>

    <!-- CONFIRMAR ASISTENCIA -->
    <a
      class="whatsapp-btn"
      href="https://wa.me/5492644505347?text=Hola%20Jana%20%F0%9F%92%9A%20Confirmo%20mi%20asistencia%20a%20tus%2015%20a%C3%B1os%20el%2028%2F11%2F2026."
      target="_blank"
      rel="noopener noreferrer"
    >
      ✨ Confirmar asistencia
    </a>

    <!-- CÓMO LLEGAR -->
    <a
      class="maps-btn"
      href="https://maps.app.goo.gl/FAjcQHvUwKji2seM9"
      target="_blank"
      rel="noopener noreferrer"
    >
      📍 Cómo llegar
    </a>

    <p
      style="
        font-family:'Great Vibes',cursive;
        font-size:2.1rem;
        color:#e8cb78;
        margin:22px 0 0;
      "
    >
      ¡Te espero!
    </p>

  </div>

</div>

<script>

const target =
  new Date("2026-11-28T21:30:00-03:00").getTime();

function update(){

  const d = target - Date.now();

  const el = document.getElementById("countdown");

  if(d <= 0){

    el.innerHTML =
      "✨ ¡Llegó el gran día! ✨";

    return;
  }

  const days =
    Math.floor(d / 86400000);

  const hrs =
    Math.floor(
      (d % 86400000) / 3600000
    );

  const min =
    Math.floor(
      (d % 3600000) / 60000
    );

  const sec =
    Math.floor(
      (d % 60000) / 1000
    );

  el.innerHTML =
    `Faltan <span>${days}</span> días ·
     <span>${hrs}</span> hs ·
     <span>${min}</span> min ·
     <span>${sec}</span> seg`;
}

setInterval(update,1000);

update();

</script>

</body>
</html>
